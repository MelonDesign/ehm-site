:root{--bg:#161514;--fg:#E2D2C0;--acc:#D24A1C}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);transition:background .8s ease,color .8s ease;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px;gap:clamp(20px,4vh,44px);overflow-x:hidden}
.stage{width:min(94vw,1100px);transition:opacity .8s ease}
.stage.out{opacity:0}

.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
/* glyphs: draw outline, then fill */
.g{fill:var(--fg);fill-rule:evenodd;stroke:var(--fg);stroke-width:.7;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0;
 animation:draw 1.1s cubic-bezier(.5,0,.2,1) var(--d) backwards,fillin .7s ease calc(var(--d) + .75s) backwards,settle .9s cubic-bezier(.2,.8,.2,1) var(--d) backwards}
@keyframes draw{from{stroke-dashoffset:1;fill-opacity:0}to{stroke-dashoffset:0;fill-opacity:0}}
@keyframes fillin{from{fill-opacity:0}to{fill-opacity:1}}
@keyframes settle{from{transform:translateY(10px)}to{transform:none}}
.blk{transform-box:fill-box;transform-origin:50% 50%;animation:pop .6s cubic-bezier(.3,1.6,.5,1) var(--d) backwards;stroke:none}

.tri{fill:var(--acc);transform-box:fill-box;transform-origin:50% 100%;animation:drop .8s cubic-bezier(.3,1.4,.5,1) 6.2s backwards}
@keyframes drop{from{transform:translateY(-120px) rotate(-18deg);opacity:0}60%{opacity:1}to{transform:none}}
/* construction lines */
.c{stroke-dasharray:1;stroke-dashoffset:0;animation:cdraw 1.3s ease-in-out var(--d) backwards,cfade 1.6s ease 6.9s forwards}
.ax{stroke-dasharray:.012 .02}
@keyframes cdraw{from{stroke-dashoffset:1;opacity:1}to{stroke-dashoffset:0;opacity:1}}
@keyframes cfade{to{opacity:.28}}
.ax{animation:axdraw 1s ease-out 1.1s backwards,cfade 1.6s ease 6.9s forwards}
@keyframes axdraw{from{opacity:0}to{opacity:1}}
@keyframes slin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* copy */
.copy{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:84px}
.status{margin:0;font-size:clamp(15px,2.4vw,18px);letter-spacing:.01em;min-height:1.6em;transition:opacity .6s ease}
.status.hide{opacity:0}
.links{font-size:13px}
.links a{color:var(--fg);text-decoration:none;border-bottom:1px solid currentColor;padding:6px 0;opacity:.75;display:inline-block}
.links a:hover{opacity:1;border-color:var(--acc)}
a:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{animation:none!important}
 .c{opacity:.28}
 .status,.stage{transition:none}
}
</style>
